name: CI

# Gerbang mutu: jalan di setiap PR ke main (dan push ke main).
# Validasi yang sama dengan yang dipakai produksi: prisma generate, lint,
# type-check, test, lalu build database + shared + api + web.
# OPS-9 (2026-08-05): api sekarang ikut di-`tsc` dan dijalankan dari dist/ di
# produksi, dan `next build` tidak lagi di-bypass `ignoreBuildErrors` — jadi
# type error di web pun menggagalkan step "Build web" di bawah.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      # Build dulu paket internal — `tsx`/vitest resolve @tokopudidi/* ke dist-nya.
      - name: Build packages (database + shared)
        run: |
          npm run build -w @tokopudidi/database
          npm run build -w @tokopudidi/shared

      - name: Lint
        run: npm run lint

      # Terpisah dari "Build api" karena cakupannya lebih luas: tsconfig.json
      # mencakup *.test.ts, sedangkan tsconfig.build.json (dipakai build) tidak.
      - name: Typecheck api
        run: npm run typecheck -w @tokopudidi/api

      - name: Test
        run: npm run test

      # Artefak yang sama dengan yang dijalankan produksi (Dockerfile: node dist/index.js).
      - name: Build api
        run: npm run build -w @tokopudidi/api

      - name: Build web (mirror produksi)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build -w @tokopudidi/web
